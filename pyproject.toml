[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symptom-dx"
version = "0.1.0"
description = "Symptom-based disease prediction comparing knowledge-graph, vector and agentic RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-groq>=0.2,<0.4",
    "langchain-neo4j>=0.3,<0.5",
    "neo4j>=5.20",
    "ddgs>=9.0",
    "llama-index-core>=0.12,<0.13",
    "llama-index-embeddings-ollama>=0.5,<0.7",
    "llama-index-llms-groq>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter"]

[project.scripts]
symptom-dx = "symptom_dx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip(strict=) is noise for same-length DataFrame columns

[tool.ruff.lint.per-file-ignores]
"src/symptom_dx/prompts.py" = ["E501"]  # prompt text is kept unwrapped on purpose
